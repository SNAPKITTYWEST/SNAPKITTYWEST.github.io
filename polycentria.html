<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polycentria — Scalar Field Tessellation Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}
canvas{display:block;width:100vw;height:100vh;}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}
#top{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;}
#title{font-size:11px;color:#bf5af2;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 0 20px #bf5af2;}
#subtitle{font-size:9px;color:#333;letter-spacing:.2em;margin-top:4px;}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:32px;align-items:center;pointer-events:all;}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;}
.ctrl label{font-size:9px;color:#555;letter-spacing:.15em;}
.ctrl input[type=range]{-webkit-appearance:none;width:120px;height:2px;background:#1a1a2a;outline:none;border-radius:1px;}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#bf5af2;cursor:pointer;box-shadow:0 0 8px #bf5af2;}
.ctrl .val{font-size:10px;color:#bf5af2;font-family:'Courier New',monospace;min-width:36px;text-align:center;}
#metrics{position:absolute;top:16px;right:20px;font-size:9px;color:#222;letter-spacing:.1em;line-height:2;}
#metrics .live{color:#0a84ff;}
#metrics .warn{color:#ff453a;}
#resonance{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#00ff88;letter-spacing:.3em;text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 0 30px #00ff88;}
#seed-display{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:9px;color:#1a1a2a;letter-spacing:.15em;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div id="title">⬡ POLYCENTRIA — SHD-CCP TESSELLATION CRYSTAL</div>
    <div id="subtitle">SCALAR FIELD GEOMETRIC BACKPROPAGATION · HOPF FIBRATION ENGINE</div>
  </div>
  <div id="metrics">
    <div>ENTROPY <span id="m-entropy" class="live">0.000</span></div>
    <div>TORSION  <span id="m-torsion" class="live">0.00</span></div>
    <div>TENSION  <span id="m-tension" class="live">1.00</span></div>
    <div>PHASE    <span id="m-phase"   class="live">0.000</span></div>
    <div>WORM     <span id="m-worm"    class="live">——</span></div>
  </div>
  <div id="resonance">⬡ RIEMANN ZETA RESONANCE POLE ⬡<br/>ABSOLUTE SYMMETRY ACHIEVED</div>
  <div id="controls">
    <div class="ctrl">
      <label>TORSION</label>
      <input type="range" id="c-torsion" min="0" max="12" step="0.1" value="6"/>
      <span class="val" id="v-torsion">6.0</span>
    </div>
    <div class="ctrl">
      <label>TENSION</label>
      <input type="range" id="c-tension" min="0" max="2" step="0.01" value="1"/>
      <span class="val" id="v-tension">1.00</span>
    </div>
    <div class="ctrl">
      <label>FREQUENCY</label>
      <input type="range" id="c-freq" min="0.1" max="3" step="0.05" value="1"/>
      <span class="val" id="v-freq">1.00</span>
    </div>
    <div class="ctrl">
      <label>SEED</label>
      <input type="range" id="c-seed" min="0" max="65535" step="1" value="13371"/>
      <span class="val" id="v-seed">13371</span>
    </div>
  </div>
  <div id="seed-display">EINSTEIN TILE · 0x3429 · WORM:GENESIS</div>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

// ── Shaders ───────────────────────────────────────────────────────────────────

const VS = `
precision highp float;
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0., 1.); }
`;

const FS = `
precision highp float;
uniform float u_time;
uniform vec2  u_res;
uniform float u_torsion;
uniform float u_tension;
uniform float u_freq;
uniform float u_seed;

#define PHI 1.6180339887498948
#define TAU 6.2831853071795864
#define ITER 96

// ── Math ──────────────────────────────────────────────────────────────────────

mat2 rot(float a) {
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}

vec3 hopf(float eta, float xi1, float xi2) {
  // Hopf fibration S^3 → S^2: maps circle fiber to point on 2-sphere
  float s = sin(eta), c = cos(eta);
  return vec3(
    s * cos(xi1 + xi2),
    s * sin(xi1 + xi2),
    c * cos(xi1 - xi2)
  ) * .5 + vec3(c * sin(xi1 - xi2) * .5, 0., 0.);
}

// ── Trefoil knot parametric ───────────────────────────────────────────────────

vec3 trefoil(float t, float phase, float freq) {
  float tt = t * freq + phase;
  float x = sin(tt) + 2. * sin(2.*tt);
  float y = cos(tt) - 2. * cos(2.*tt);
  float z = -sin(3.*tt);
  return vec3(x,y,z) * .18;
}

// ── Prime sieve hash (Escher 13-cube) ─────────────────────────────────────────

float escher(vec3 p, float seed) {
  // deterministic pseudo-random via prime sieve
  vec3 q = fract(p * vec3(127.1, 311.7, 74.7) + seed * .00001);
  q = q * q * (3. - 2.*q); // smoothstep
  float n = q.x + 37.*q.y + 439.*q.z;
  return fract(sin(n) * 43758.5453);
}

// ── Scalar field density ───────────────────────────────────────────────────────

float field(vec3 p, float t, float freq, float torsion, float seed) {
  float d = 0.;
  vec3 q = p;

  // Three Trefoil Knot wave functions (phase-offset by 2π/3)
  for(int i=0;i<3;i++) {
    float phase = float(i) * TAU / 3.;
    vec3 tk = trefoil(t * .3, phase + torsion * .5, freq);
    vec3 r = q - tk;
    float knot = 1. / (1. + dot(r,r) * 12.);
    d += knot;
    // rotate via Hopf fiber twist
    q.xy = rot(t * .07 * PHI + phase) * q.xy;
    q.yz = rot(t * .05 / PHI) * q.yz;
  }

  // Escher hash noise (Fokker-Planck ambient)
  d += escher(q * 2.1, seed) * .12;

  // Chiral compression toward zero-point
  float r2 = dot(p,p);
  d *= exp(-r2 * .8); // Gaussian envelope = singularity pull

  return d;
}

// ── TQF Tension Web color ─────────────────────────────────────────────────────

vec3 tqf_color(float tension_err) {
  // stable cyan → critical red based on tension error
  return mix(
    vec3(0., 0.8, 1.),   // stable: cyan
    vec3(1., .1, .3),    // critical: magenta-red
    smoothstep(0., 1., tension_err)
  );
}

// ── Smooth hash ───────────────────────────────────────────────────────────────

float h3(vec3 p) {
  p = fract(p * vec3(127.1, 311.7, 74.7));
  p += dot(p, p.yzx + 19.19);
  return fract((p.x + p.y) * p.z);
}

float h2(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

// Fixed 4-octave fbm — no dynamic breaks (WebGL safe)
float fbm4(vec3 p) {
  float v = 0.;
  v += 0.500 * (h3(p*1.0)*2.-1.);
  v += 0.250 * (h3(p*2.1)*2.-1.);
  v += 0.125 * (h3(p*4.4)*2.-1.);
  v += 0.063 * (h3(p*9.2)*2.-1.);
  return v;
}

float fbm3(vec3 p) {
  float v = 0.;
  v += 0.500 * (h3(p*1.0)*2.-1.);
  v += 0.250 * (h3(p*2.1)*2.-1.);
  v += 0.125 * (h3(p*4.4)*2.-1.);
  return v;
}

// ── UFO disc density ──────────────────────────────────────────────────────────

float one_ufo(vec3 p, vec3 center, float r, float flat) {
  vec3 q = p - center;
  q.y *= flat;
  float body = length(q) - r;
  float dome = length(q - vec3(0., r*.3, 0.)) - r*.55;
  float saucer = max(body, -dome);
  float rim = abs(length(q.xz) - r*.82) - r*.055;
  rim = max(rim, abs(q.y) - r*.1);
  float sd = min(saucer, rim);
  if(sd < 0.0) return (-sd / r);
  return 0.0;
}

float ufo_field(vec3 p, float t, float seed) {
  float density = 0.;
  float s = seed * 0.00003;
  // 7 UFOs — fully unrolled, no loop with dynamic branches
  float fi; vec3 center; float angle;

  fi=0.; angle=t*.07 + fi*TAU/7.+s; center=vec3((.6+fi*.22)*cos(angle), sin(t*.04+fi*.44)*0.35, (.6+fi*.22)*sin(angle)); center.yz=rot(fi*.44*.4)*center.yz; density+=one_ufo(p,center,.045+fi*.008,3.8);
  fi=1.; angle=t*.083+fi*TAU/7.+s; center=vec3((.82+fi*.22)*cos(angle), sin(t*.055+fi*.44)*0.35,(.82+fi*.22)*sin(angle)); center.yz=rot(fi*.44*.4)*center.yz; density+=one_ufo(p,center,.053+fi*.008,3.5);
  fi=2.; angle=t*.096+fi*TAU/7.+s; center=vec3((1.04)*cos(angle), sin(t*.068+fi*.44)*.3,(1.04)*sin(angle)); center.xz=rot(fi*.2)*center.xz; density+=one_ufo(p,center,.061+fi*.008,4.0);
  fi=3.; angle=t*.109+fi*TAU/7.+s; center=vec3((1.26)*cos(angle), sin(t*.08+fi*.44)*.28,(1.26)*sin(angle)); center.yz=rot(fi*.44*.4)*center.yz; density+=one_ufo(p,center,.069,3.6);
  fi=4.; angle=t*.122+fi*TAU/7.+s; center=vec3((1.48)*cos(angle), sin(t*.09+fi*.44)*.25,(1.48)*sin(angle)); center.xz=rot(fi*.2)*center.xz; density+=one_ufo(p,center,.061,4.2);
  fi=5.; angle=t*.135+fi*TAU/7.+s; center=vec3((1.7)*cos(angle),  sin(t*.1+fi*.44)*.22,(1.7)*sin(angle));  center.yz=rot(fi*.44*.4)*center.yz; density+=one_ufo(p,center,.053,3.9);
  fi=6.; angle=t*.148+fi*TAU/7.+s; center=vec3((1.92)*cos(angle), sin(t*.11+fi*.44)*.18,(1.92)*sin(angle)); center.xz=rot(fi*.2)*center.xz; density+=one_ufo(p,center,.045,4.5);

  return density;
}

// ── Nebula field ──────────────────────────────────────────────────────────────

float nebula_field(vec3 p, float t, float seed) {
  float s = seed * 0.0001;
  // Domain warp via fixed fbm
  vec3 warp = vec3(
    fbm3(p + vec3(0., 0., t*.03)),
    fbm3(p + vec3(1.7, 9.2, t*.02)),
    fbm3(p + vec3(8.3, 2.8, t*.025))
  ) * .45;
  vec3 wp = p + warp;

  float n = 0.;
  float l1 = fbm4(wp*.8 + vec3(s, t*.01, 0.));
  n += smoothstep(-.1,.5,l1) * exp(-length(p - vec3(.8,.2,-.3)) * 1.3);
  float l2 = fbm4(wp*1.4 + vec3(3.1, s, t*.015));
  n += smoothstep(.0,.6,l2) * exp(-length(p - vec3(-.6,-.1,.5)) * 1.6);
  float l3 = fbm3(wp*2.2 + vec3(t*.02, 7.4, s));
  n += smoothstep(.1,.7,l3) * exp(-length(p) * .95) * .45;
  return clamp(n * .38, 0., 1.);
}

// ── Alien crystalline rings ───────────────────────────────────────────────────

float alien_rings(vec3 p, float t, float seed) {
  float rings = 0.;
  float fi; vec3 q; vec2 qq; float R,r,tilt,torus,pulse;

  fi=0.; R=.50; r=.040; tilt=fi*.6+t*(.020+fi*.005); q=p; q.xz=rot(tilt)*q.xz; q.xy=rot(fi*1.2)*q.xy; qq=vec2(length(q.xz)-R,q.y); torus=length(qq)-r; pulse=sin(t*(.8+fi*.3)+fi*2.1)*.5+.5; if(torus<0.)rings+=(-torus/r)*pulse*.6;
  fi=1.; R=.68; r=.033; tilt=fi*.6+t*(.025+fi*.005); q=p; q.xz=rot(tilt)*q.xz; q.xy=rot(fi*1.2)*q.xy; qq=vec2(length(q.xz)-R,q.y); torus=length(qq)-r; pulse=sin(t*(.8+fi*.3)+fi*2.1)*.5+.5; if(torus<0.)rings+=(-torus/r)*pulse*.6;
  fi=2.; R=.86; r=.026; tilt=fi*.6+t*(.030+fi*.005); q=p; q.xz=rot(tilt)*q.xz; q.xy=rot(fi*1.2)*q.xy; qq=vec2(length(q.xz)-R,q.y); torus=length(qq)-r; pulse=sin(t*(.8+fi*.3)+fi*2.1)*.5+.5; if(torus<0.)rings+=(-torus/r)*pulse*.6;
  fi=3.; R=1.04; r=.019; tilt=fi*.6+t*(.035+fi*.005); q=p; q.xz=rot(tilt)*q.xz; q.xy=rot(fi*1.2)*q.xy; qq=vec2(length(q.xz)-R,q.y); torus=length(qq)-r; pulse=sin(t*(.8+fi*.3)+fi*2.1)*.5+.5; if(torus<0.)rings+=(-torus/r)*pulse*.6;

  return rings;
}

// ── Phase-conjugate inverse streams (backprop streams) ────────────────────────

float backprop_stream(vec3 p, float t, float freq) {
  float s = 0.;
  for(int i=0;i<12;i++) {
    // 12 magenta phase-conjugate inverse streams
    float angle = float(i) * TAU / 12.;
    vec3 dir = vec3(cos(angle), sin(angle), sin(angle * PHI));
    // time-reversed: -t
    float wave = sin(dot(p, dir) * freq * 8. - t * .5 * float(i+1) * -.3);
    s += wave * .04;
  }
  return s;
}

// ── Main ray march ────────────────────────────────────────────────────────────

void main() {
  vec2 uv = (gl_FragCoord.xy - u_res * .5) / min(u_res.x, u_res.y);

  float seed    = u_seed;
  float torsion = u_torsion;
  float tension = u_tension;
  float freq    = u_freq;
  float t       = u_time;

  // Ray setup — slight perspective
  vec3 ro = vec3(0., 0., 2.8);
  vec3 rd = normalize(vec3(uv, -1.2));

  // Rotate view slowly (ergodic winding feel)
  float rx = t * .04;
  float ry = t * .027 * PHI;
  rd.xz = rot(ry) * rd.xz;
  rd.yz = rot(rx * .6) * rd.yz;
  ro.xz = rot(ry) * ro.xz;
  ro.yz = rot(rx * .6) * ro.yz;

  // ── Volume march ──────────────────────────────────────────────────────────
  vec3 col = vec3(0.);
  float alpha = 0.;
  float step_size = 0.045;
  vec3 p = ro;

  // Tension error — how far from equilibrium (1.0)
  float tension_err = abs(tension - 1.) * 2.;
  bool resonance = (abs(torsion - 12.) < .05 && abs(tension - 1.) < .02);

  for(int i=0;i<ITER;i++) {
    if(alpha > .98) break;
    p += rd * step_size;

    float f    = field(p, t, freq, torsion, seed);
    float bp   = backprop_stream(p, t, freq);
    float ufo  = ufo_field(p, t, seed);
    float neb  = nebula_field(p, t, seed);
    float rings= alien_rings(p, t, seed);

    float combined = f + ufo * .6 + neb * .35 + rings * .5;

    if(combined > .008) {
      float density = combined * step_size * 3.2;

      float r2    = dot(p,p);
      float depth = float(i) / float(ITER);

      // ── Base scalar field: deep purple → electric blue ───────────────────
      vec3 c_core = mix(
        vec3(.45, .05, .9),
        vec3(.0,  .5,  1.),
        smoothstep(0., .8, r2 * 1.5)
      );
      c_core = mix(c_core, vec3(.0, .9, .85), f * .4);

      // ── Nebula: amber/teal alien gas clouds ──────────────────────────────
      if(neb > .01) {
        vec3 c_neb = mix(
          vec3(.0, .6, .5),    // deep teal
          vec3(.6, .2, .9),    // violet
          smoothstep(0., 1., neb * 2.)
        );
        // nebula pillars of creation glow
        c_neb = mix(c_neb, vec3(1., .4, .0), neb * neb * 1.5); // amber cores
        c_core = mix(c_core, c_neb, neb * .7);
      }

      // ── UFO: metallic hull + rim glow ────────────────────────────────────
      if(ufo > .01) {
        // Hull: brushed alien metal — cold silver-blue
        vec3 c_hull = vec3(.7, .85, 1.) * (.5 + ufo * .5);
        // Rim: pulsing green/gold energy ring
        float rim_pulse = sin(t * 3. + r2 * 8.) * .5 + .5;
        vec3 c_rim  = mix(vec3(.2, 1., .4), vec3(1., .9, .0), rim_pulse);
        vec3 c_ufo  = mix(c_hull, c_rim, smoothstep(.3, .9, ufo));
        // Alien glow halo underneath
        c_ufo += vec3(.0, .8, .4) * exp(-r2 * 3.) * ufo * .8;
        c_core = mix(c_core, c_ufo, min(1., ufo * 1.4));
      }

      // ── Rings: crystalline iridescent ────────────────────────────────────
      if(rings > .01) {
        float angle_r = atan(p.z, p.x);
        vec3 c_ring = vec3(
          sin(angle_r * 3. + t) * .5 + .5,
          cos(angle_r * 5. - t * .7) * .5 + .5,
          sin(angle_r * 7. + t * .4) * .5 + .5
        );
        c_ring = mix(c_ring, vec3(.5, 1., .9), .4); // teal shift
        c_core = mix(c_core, c_ring, min(1., rings * 1.2));
      }

      // ── Phase-conjugate magenta backprop streams ─────────────────────────
      c_core += vec3(.8, .0, .6) * abs(bp) * 2.5;

      // ── TQF Tension Web ───────────────────────────────────────────────────
      vec3 tqf = tqf_color(tension_err);
      float web = pow(f, 3.) * tension_err * 3.;
      c_core = mix(c_core, tqf, web);

      // ── Riemann resonance pole ────────────────────────────────────────────
      if(resonance) {
        float pillar = exp(-p.x*p.x * 40.) * exp(-p.z*p.z * 40.);
        c_core += vec3(0., 1., .9) * pillar * 6.;
        // UFOs align to the pole during resonance
        c_core += vec3(.3, 1., .5) * ufo * pillar * 4.;
      }

      // ── Depth fog ─────────────────────────────────────────────────────────
      c_core *= mix(1., .15, depth);

      // Accumulate
      col += c_core * density * (1. - alpha);
      alpha += density * (1. - alpha) * .65;
    }
  }

  // ── Background: alien deep space ─────────────────────────────────────────
  float nebula_bg = 0.;
  {
    vec3 np = rd * 2.5;
    for(int i=0;i<4;i++) {
      np = abs(np) / dot(np,np) - .85;
    }
    nebula_bg = length(np) * .12;
  }

  // Deep space color: near-black with violet/teal nebula wisps
  vec3 bg = mix(
    vec3(0., 0., 0.015),       // void black
    vec3(.06, .0, .15),         // deep violet
    nebula_bg
  );
  // Teal nebula arm
  float teal_neb = max(0., sin(rd.x * 4. + rd.y * 3. + t * .01) * .3 + .1);
  bg = mix(bg, vec3(.0, .08, .12), teal_neb * nebula_bg);
  // Amber dust lane
  float amber = max(0., cos(rd.z * 5. + rd.x * 2.) * .15);
  bg += vec3(.12, .05, .0) * amber * nebula_bg;

  // Star field — two sizes
  float star_sm = pow(clamp(escher(rd * 300., seed + 1.),0.,1.), 22.) * .9;
  float star_lg = pow(clamp(escher(rd * 80.,  seed + 7.),0.,1.), 28.) * 1.8;
  vec3 star_col = mix(vec3(.5,.7,1.), vec3(1.,.5,.2),
    escher(rd * 40., seed + 3.));
  bg += star_sm + star_col * star_lg;

  // Distant galaxy smear
  float galaxy = exp(-length(rd.xy - vec2(.3, .2)) * 12.) * .08;
  bg += vec3(.4, .2, .6) * galaxy;

  col = col + bg * (1. - alpha);

  // ── Tone mapping + vignette ───────────────────────────────────────────────
  col = col / (col + 1.);           // reinhard
  col = pow(col, vec3(.45));        // gamma

  float vign = 1. - dot(uv,uv) * .5;
  col *= vign;

  gl_FragColor = vec4(col, 1.);
}
`;

// ── Setup ─────────────────────────────────────────────────────────────────────

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const U = {
  time:    gl.getUniformLocation(prog, 'u_time'),
  res:     gl.getUniformLocation(prog, 'u_res'),
  torsion: gl.getUniformLocation(prog, 'u_torsion'),
  tension: gl.getUniformLocation(prog, 'u_tension'),
  freq:    gl.getUniformLocation(prog, 'u_freq'),
  seed:    gl.getUniformLocation(prog, 'u_seed'),
};

// ── Controls ──────────────────────────────────────────────────────────────────

const state = { torsion: 6, tension: 1, freq: 1, seed: 13371 };

function wire(id, valId, key, fmt) {
  const el = document.getElementById(id);
  const vl = document.getElementById(valId);
  el.addEventListener('input', () => {
    state[key] = parseFloat(el.value);
    vl.textContent = fmt(state[key]);
    updateSeedDisplay();
  });
}

wire('c-torsion', 'v-torsion', 'torsion', v => v.toFixed(1));
wire('c-tension', 'v-tension', 'tension', v => v.toFixed(2));
wire('c-freq',    'v-freq',    'freq',    v => v.toFixed(2));
wire('c-seed',    'v-seed',    'seed',    v => Math.floor(v));

function updateSeedDisplay() {
  const hex = Math.floor(state.seed).toString(16).toUpperCase().padStart(4,'0');
  document.getElementById('seed-display').textContent =
    `EINSTEIN TILE · 0x${hex} · WORM:${wormHead(state.seed)}`;
}

function wormHead(seed) {
  const h = Math.abs(Math.sin(seed * 137.508) * 0xFFFFFFFF) >>> 0;
  return h.toString(16).slice(0,8).toUpperCase();
}

// ── Metrics ───────────────────────────────────────────────────────────────────

let resonanceTimer = 0;
const resonEl = document.getElementById('resonance');

function updateMetrics(t) {
  const entropy = Math.abs(Math.sin(t * 0.3 + state.seed * 0.001) * 0.21);
  const torsionErr = Math.abs(state.torsion - 12) / 12;
  const tensionErr = Math.abs(state.tension - 1.0);
  const phase = ((t * 0.1) % (Math.PI * 2)).toFixed(3);
  const worm = wormHead(state.seed + t * 0.01);

  document.getElementById('m-entropy').textContent = entropy.toFixed(3);
  document.getElementById('m-torsion').textContent = state.torsion.toFixed(2);
  document.getElementById('m-tension').textContent = state.tension.toFixed(2);
  document.getElementById('m-phase').textContent   = phase;
  document.getElementById('m-worm').textContent    = worm.slice(0,8);

  const tEl = document.getElementById('m-tension');
  tEl.className = tensionErr > 0.5 ? 'warn' : 'live';

  // Riemann Zeta Resonance Pole
  const isResonance = Math.abs(state.torsion - 12) < 0.05 && tensionErr < 0.02;
  if (isResonance) {
    resonanceTimer = 120;
  }
  if (resonanceTimer > 0) {
    resonanceTimer--;
    resonEl.style.opacity = Math.min(1, resonanceTimer / 20);
  } else {
    resonEl.style.opacity = 0;
  }
}

// ── Resize ────────────────────────────────────────────────────────────────────

function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ───────────────────────────────────────────────────────────────

const t0 = performance.now();
let frame = 0;

function render() {
  requestAnimationFrame(render);
  const t = (performance.now() - t0) / 1000;

  gl.uniform1f(U.time,    t);
  gl.uniform2f(U.res,     canvas.width, canvas.height);
  gl.uniform1f(U.torsion, state.torsion);
  gl.uniform1f(U.tension, state.tension);
  gl.uniform1f(U.freq,    state.freq);
  gl.uniform1f(U.seed,    state.seed);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (++frame % 6 === 0) updateMetrics(t);
}

updateSeedDisplay();
render();

// ── Keyboard: SPACE = random seed, R = reset ──────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    state.seed = Math.random() * 65535;
    document.getElementById('c-seed').value = state.seed;
    document.getElementById('v-seed').textContent = Math.floor(state.seed);
    updateSeedDisplay();
  }
  if (e.key === 'r' || e.key === 'R') {
    state.torsion = 6; state.tension = 1; state.freq = 1; state.seed = 13371;
    document.getElementById('c-torsion').value = 6;
    document.getElementById('c-tension').value = 1;
    document.getElementById('c-freq').value    = 1;
    document.getElementById('c-seed').value    = 13371;
    ['v-torsion','v-tension','v-freq'].forEach((id,i) => {
      document.getElementById(id).textContent = ['6.0','1.00','1.00'][i];
    });
    document.getElementById('v-seed').textContent = '13371';
    updateSeedDisplay();
  }
  // Torsion to 12 + Tension to 1.0 = resonance pole
  if (e.key === 'z' || e.key === 'Z') {
    state.torsion = 12; state.tension = 1.0;
    document.getElementById('c-torsion').value = 12;
    document.getElementById('c-tension').value = 1.0;
    document.getElementById('v-torsion').textContent = '12.0';
    document.getElementById('v-tension').textContent = '1.00';
  }
});
</script>
</body>
